# SIFAP — ADR-007: un único servicio `app` (Next.js + API), SQLite en el volumen `sifap-data`.
#   docker compose up --build -d
#   docker compose run --rm app npm run lote:pagamentos
services:
  app:
    build: .
    # Reinicia ante fallos (p. ej. migración), con tope para no entrar en bucle.
    restart: on-failure:5
    ports:
      - "${SIFAP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: file:/data/sifap.db
      SIFAP_USER: ${SIFAP_USER:-SIFAPUSR}
      LEGACY_DOC_ESPECIAL_ENABLED: ${LEGACY_DOC_ESPECIAL_ENABLED:-false}
      LEGACY_STATUS_BRANCO_ALTERACAO_ENABLED: ${LEGACY_STATUS_BRANCO_ALTERACAO_ENABLED:-false}
      SIFAP_QUIRKS_CORRIGIDOS: ${SIFAP_QUIRKS_CORRIGIDOS:-}
      SIFAP_LOCK_EXPIRACAO_MIN: ${SIFAP_LOCK_EXPIRACAO_MIN:-120}
      TZ: America/Sao_Paulo
    volumes:
      - sifap-data:/data

volumes:
  sifap-data:
    # Nombre fijo (sin prefijo del proyecto compose): backup/restore predecibles.
    # SIFAP_VOLUME solo se cambia para pruebas aisladas (scripts/docker-smoke.sh).
    name: ${SIFAP_VOLUME:-sifap-data}
